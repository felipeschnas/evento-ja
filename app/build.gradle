plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.eventoja'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.eventoja"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Endereco da API. 10.0.2.2 e o "localhost" do computador visto de dentro do emulador.
        // Para usar outro endereco: ./gradlew assembleDebug -PapiBaseUrl=http://192.168.0.10:8080/
        buildConfigField "String", "API_BASE_URL", "\"${project.findProperty('apiBaseUrl') ?: 'http://10.0.2.2:8080/'}\""

        // true = usa dados de exemplo (mock) em vez de chamar a API
        buildConfigField "boolean", "USAR_MOCK", "${project.findProperty('usarMock') ?: 'false'}"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Consumo da API REST (Retrofit usa OkHttp e Gson por baixo)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ViewModel e LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    testImplementation 'junit:junit:4.13.2'
}
